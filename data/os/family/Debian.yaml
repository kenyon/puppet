---
# Debian-family-specific data.

lookup_options:
  apt::sources:
    merge: hash

classes:
  - apt
  - apt::backports
  - profile::apparmor
  - profile::debian::apt_listchanges
  - profile::debian::apticron
  - profile::debian::debsums
  - unattended_upgrades

packages:
  - apt-file
  - apt-listbugs
  - apt-show-versions
  - aptitude
  - aptitude-doc-en
  - bash-doc
  - bind9-host
  - debian-goodies
  - dlocate
  - bind9-dnsutils
  - lsb-release
  - man-db
  - manpages-dev
  - molly-guard
  - moreutils
  - mtr-tiny
  - needrestart
  - popularity-contest
  - reboot-notifier
  - vim

apt::backports::include:
  src: true

apt::backports::location: https://deb.debian.org/debian

apt::confs:
  aptitude:
    content: |
      Aptitude {
          CmdLine {
              Always-Prompt "1";
              Show-Versions "1";
          };
          UI {
              Advance-On-Action "1";
          }
      };
  no-pager:
    content: |
      Binary::apt::Pager "false";
  show-versions:
    content: |
      APT::Get::Show-Versions "1";

apt::purge:
  sources.list: true
  sources.list.d: true
  preferences: true
  preferences.d: true

apt::sources:
  debian:
    location: https://deb.debian.org/debian
    release: "%{facts.os.distro.codename}"
    repos: main contrib non-free non-free-firmware
    include:
      src: true
    architecture: "%{facts.os.architecture}"
    keyring: /usr/share/keyrings/debian-archive-keyring.gpg

  security:
    location: https://deb.debian.org/debian-security
    release: "%{facts.os.distro.codename}-security"
    repos: main contrib non-free non-free-firmware
    include:
      src: true
    architecture: "%{facts.os.architecture}"
    keyring: /usr/share/keyrings/debian-archive-keyring.gpg

  updates:
    location: https://deb.debian.org/debian
    release: "%{facts.os.distro.codename}-updates"
    repos: main contrib non-free non-free-firmware
    include:
      src: true
    architecture: "%{facts.os.architecture}"
    keyring: /usr/share/keyrings/debian-archive-keyring.gpg

  github-cli:
    location: https://cli.github.com/packages
    release: stable
    repos: main
    key:
      name: github-cli.gpg
      source: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    architecture: "%{facts.os.architecture}"

  openvox:
    location: https://apt.voxpupuli.org
    release: "debian%{facts.os.release.major}"
    repos: openvox8
    key:
      name: openvox-keyring.gpg
      source: https://apt.voxpupuli.org/openvox-keyring.gpg

unattended_upgrades::auto:
  clean: 1

unattended_upgrades::extra_origins:
  - origin=apt.postgresql.org
  - origin=Debian Backports,codename=${distro_codename}-backports,label=Debian Backports
  - origin=Debian,codename=${distro_codename}-updates,label=Debian
  - origin=Docker
  - origin=gh
  - origin=Vox Pupuli
  - origin=vscode stable

unattended_upgrades::mail:
  report: on-change
  to: root@localhost

unattended_upgrades::syslog_enable: true

profile::kenyon::dotfiles:
  - .devscripts
  - .dput.cf
  - .quiltrc

profile::kenyon::groups:
  - sudo
