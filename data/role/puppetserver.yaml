---
classes:
  - hiera
  - profile::puppetserver
  - profile::ruby
  - puppetdb
  - puppet::server::puppetdb

packages:
  - augeas-tools

file_lines:
  # Don't want /etc/puppetlabs/code/environments tracked by etckeeper because it contains git
  # repos. This causes etckeeper cron jobs to fail, causing unnecessary emails to me.
  etc_gitignore_puppetlabs_code_environments:
    path: /etc/.gitignore
    line: puppetlabs/code/environments

hiera::create_symlink: false
hiera::eyaml_pkcs7_private_key: /etc/puppetlabs/puppet/eyaml/private_key.pem
hiera::eyaml_pkcs7_public_key: /etc/puppetlabs/puppet/eyaml/public_key.pem
hiera::eyaml: true
hiera::group: root
hiera::hiera_version: '5'
hiera::keysdir: /etc/puppetlabs/puppet/eyaml
hiera::owner: root
hiera::puppet_conf_manage: false

puppet::server_common_modules_path: ''
puppet::server_external_nodes: ''
puppet::server_foreman: false
puppet::server_reports: log,puppetdb
puppet::server_storeconfigs: true
puppet::server_strict_variables: true
puppet::server: true
puppet::server::package: openvox-server
puppet::server::puppetdb::server: "%{trusted.certname}"

# theforeman-puppet manages the puppetserver service
puppetdb::master::config::create_puppet_service_resource: false
puppetdb::master::config::terminus_package: openvoxdb-termini
puppetdb::postgres_version: "18"
puppetdb::puppetdb_package: openvoxdb

profile::puppetserver::r10k_deploy_settings:
  generate_types: true
  incremental: true
  purge_levels:
    - deployment
    - environment
    - puppetfile

python::venv: installed

rsyslog::config::inputs:
  puppetserver:
    type: imfile
    config:
      file: "%{settings::logdir}/puppetserver.log"
      tag: puppetserver.log
  puppetdb:
    type: imfile
    config:
      file: /var/log/puppetlabs/puppetdb/puppetdb.log
      tag: puppetdb.log
