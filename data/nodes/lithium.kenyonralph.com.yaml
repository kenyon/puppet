---
apt::sources:
  vscode:
    location: https://packages.microsoft.com/repos/vscode
    release: stable
    repos: main
    key:
      name: microsoft.asc
      source: https://packages.microsoft.com/keys/microsoft.asc
    include:
      src: false
    architecture: "%{facts.os.architecture}"

packages:
  - expect
  - firmware-b43-installer
  - firmware-misc-nonfree
  - gh
  - macfanctld

files:
  /etc/sensors.d/ignore-nonsense-temperatures.conf:
    ensure: file
    content: |
      # Managed by Puppet
      # Find sensor feature names with `sensors -u`
      # The following features have nonsense values on this system.
      chip "applesmc-isa-0300"
      ignore temp9
      ignore temp10
      ignore temp19
      ignore temp22
      ignore temp25
      ignore temp26
      ignore temp27
      ignore temp28
      ignore temp29
      ignore temp30
      ignore temp31
      ignore temp32
      ignore temp33
      ignore temp34
      ignore temp35
      ignore temp36
      ignore temp37
      ignore temp38
      ignore temp39
      ignore temp40
      ignore temp41
      ignore temp42
      ignore temp43
      ignore temp51

munin::node::plugins:
  if_wlp2s0b1:
    ensure: absent
  if_err_wlp2s0b1:
    ensure: absent

profile::puppetserver::r10k_remote: https://gitlab.com/kenyon/puppet.git
